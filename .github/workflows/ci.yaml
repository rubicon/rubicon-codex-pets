name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/check_pets.py .
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name, title, and issue link
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title is not a Conventional Commit: $TITLE"
            status=1
          fi
          case "$ACTOR" in
            'dependabot[bot]'|'rubicon-release-please[bot]') exit "$status" ;;
          esac
          if ! printf '%s' "$BRANCH" | grep -Eq '^dev/[0-9]+-[a-z0-9-]+$'; then
            echo "Branch does not match dev/<issue>-<slug>: $BRANCH"
            status=1
          fi
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "PR body does not link an issue with closing syntax"
            status=1
          fi
          exit "$status"
